- slug: all-staff-leave-policy-2026
  title: Staff Leave Policy
  doc_type: policy
  college_code: all
  audience: staff
  category: general
  issue_date: 2026-04-01
  reference_no: NU/HR/POL/2026/01
  body: |
    # Staff Leave Policy

    ## Entitlement
    Permanent staff are entitled to 30 days of earned leave and 8 days of casual leave in each calendar year.

    ## Encashment
    Earned leave may be encashed up to 15 days in a year. Casual leave cannot be carried forward or encashed.

    ## Applying
    Leave is applied for through the staff portal at least 3 working days in advance, except in emergencies.

