- slug: all-admissions-faq-2026
  title: Admissions FAQ 2027-28
  doc_type: faq
  college_code: all
  audience: public
  category: admission
  issue_date: 2026-09-01
  body: |
    # Admissions FAQ 2027-28

    ## When do applications open?
    Applications for admission to the 2027-28 academic year open on 1 December 2026 and close on 31 March 2027. Applications are accepted only through the university admissions portal.

    ## What is the application fee?
    The application fee is Rs 800. Candidates from reserved categories pay Rs 400. The fee is not refundable.

    ## How is the merit list prepared?
    Undergraduate merit lists are prepared from the qualifying examination marks. Engineering admissions also use the state entrance test score, weighted at 50 percent.

    ## Can I apply to more than one college?
    Yes. One application form lets a candidate list up to three colleges of Navrang University in order of preference.

- slug: all-campus-faq
  title: About the Campus - FAQ
  doc_type: faq
  college_code: all
  audience: public
  category: general
  issue_date: 2026-07-01
  body: |
    # About the Campus

    ## Which colleges are on campus?
    Navrang University in Sahyadri Nagar has three colleges: the Navrang College of Engineering (COE), the Navrang College of Arts and Science (CAS) and the Navrang College of Commerce and Management (COM).

    ## What are the central library timings?
    The central library is open from 08:00 to 22:00 on working days and from 09:00 to 17:00 on Sundays. It is closed on university holidays.

    ## Is there a medical centre?
    The campus health centre near Gate 2 is open 24 hours. A doctor is available from 09:00 to 21:00.

- slug: all-exam-policy-2026
  title: Examination Policy
  doc_type: policy
  college_code: all
  audience: public
  category: exam
  issue_date: 2026-06-15
  reference_no: NU/EXAM/POL/2026/01
  body: |
    # Examination Policy

    ## Eligibility
    A student must have at least 75 percent attendance in each course to sit the end-semester examination in that course. Students below 75 percent may apply to the Principal for condonation on medical grounds; condonation is never granted below 65 percent.

    ## Hall tickets
    Hall tickets are issued through the student portal. A student without a hall ticket and college ID card will not be allowed into the examination hall.

    ## Revaluation
    A student may apply for revaluation within 7 days of the declaration of results. The revaluation fee is Rs 500 per paper. Revaluation results are declared within 30 days.

    ## Malpractice
    Any student found using unfair means will have the examination in that course cancelled and will be referred to the Unfair Means Committee.

- slug: all-fee-policy-2026
  title: Fee Payment and Refund Policy
  doc_type: policy
  college_code: all
  audience: public
  category: fee
  issue_date: 2026-06-15
  reference_no: NU/ACC/POL/2026/02
  body: |
    # Fee Payment and Refund Policy

    ## Payment
    Fees are paid online through the student portal by UPI, net banking or card. Each college announces its own fee amounts and due dates in a fee circular.

    ## Late fee
    A late fee of Rs 100 per day is charged after the due date, up to a maximum of Rs 2,000. A student whose fee is unpaid 30 days after the due date may be barred from examinations.

    ## Refunds
    Fees are refunded in full only if the admission is cancelled before the term starts. After the term starts, 50 percent is refunded if cancelled within 15 days, and nothing thereafter.

- slug: all-hostel-policy-2026
  title: Hostel Rules
  doc_type: policy
  college_code: all
  audience: public
  category: hostel
  issue_date: 2026-06-20
  body: |
    # Hostel Rules

    ## Gate timings
    Hostel gates close at 22:00 for all residents. Late entry requires prior written permission from the warden.

    ## Mess
    Breakfast is served from 07:30 to 09:00, lunch from 12:30 to 14:00 and dinner from 19:30 to 21:00. Mess charges are included in the hostel fee.

    ## Rooms
    Rooms are allotted for one academic year. Cooking appliances are not allowed in rooms.

