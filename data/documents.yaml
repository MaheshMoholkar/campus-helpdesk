    # Placement Policy

    ## One-offer rule
    A student who has accepted one job offer through the Training and Placement Cell may not apply to further companies, with one exception.

    ## Dream company exception
    A student holding an offer may apply once more, only to a dream company. A dream company is one offering a CTC of Rs 10 lakh per year or more.

