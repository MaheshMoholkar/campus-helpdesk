  all-scholarship-2026: [Merit-cum-means scholarship; family income under Rs 8 lakh; apply by 30 November 2026.]
  all-hostel-guest-rules-hi: [Guests allowed only on Sundays, 10:00-17:00, with ID - stated only in Hindi.]
  all-sports-week-mr: [Sports week 10-15 November 2026; register by 25 October - stated only in Marathi.]
