# Key facts per document (slug -> facts). The golden set draws on these.
facts:
  all-admissions-faq-2026:
    - Applications for 2027 admission open on 1 December 2026 and close on 31 March 2027.
    - The application fee is Rs 800 (Rs 400 for reserved categories).
  all-campus-faq:
    - The central library is open 08:00-22:00 on working days and 09:00-17:00 on Sundays.
    - Two colleges use the helpdesk - SEC (alpha) and DSC (beta).
  all-exam-policy-2026:
    - Minimum 75% attendance in each course is required to sit the end-semester exam.
    - Revaluation costs Rs 500 per paper and must be applied for within 7 days of results.
  all-fee-policy-2026:
    - Late fee is Rs 100 per day, capped at Rs 2,000.
    - Fees are refunded in full only if admission is cancelled before the term starts.
  all-hostel-policy-2026:
    - Hostel gates close at 22:00 for all residents.
    - Mess timings - breakfast 07:30-09:00, lunch 12:30-14:00, dinner 19:30-21:00.
  hostel-fee-v1 / hostel-fee-v2:
    - v1 (2025-26) annual hostel fee Rs 55,000; v2 (2026-27) Rs 58,000, current.
  alpha-fee-structure v1 / v2:
    - v1 semester 3 fee Rs 62,000 due 31 October 2026; v2 revised to Rs 64,500 due 15 November 2026, current.
  beta-fee-structure-2026: [Semester fee Rs 38,000 due 10 November 2026.]
  alpha-exam-schedule-odd-2026: [Exams start 1 December 2026; hall tickets from 20 November 2026.]
  beta-exam-schedule-odd-2026: [Exams start 5 December 2026.]
  alpha-invigilation-duty-2026: [Invigilators report 30 minutes early; Rs 350 per session.]
  all-staff-leave-policy-2026: [30 days earned leave and 8 days casual leave a year; earned leave encashable up to 15 days a year.]
  beta-staff-meeting-oct-2026: [Staff meeting on 7 October 2026 at 15:00 in the DSC Seminar Hall.]
  beta-staff-appraisal-2026: [Self-appraisal forms due 31 October 2026.]
  all-ganesh-holiday-2026: [Expired notice - campus closed 27 August 2026.]
