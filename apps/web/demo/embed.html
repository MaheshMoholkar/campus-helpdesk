<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Widget demo - an unrelated host page</title>
    <style>
      /* Deliberately hostile host styles: the widget's shadow root should ignore them. */
      body { font-family: Georgia, serif; margin: 40px; background: #fafafa; }
      button { background: hotpink !important; font-size: 30px; }
      div { border: 1px dashed red; }
    </style>
  </head>
  <body>
    <h1>Some ERP landing page</h1>
    <p>The chat widget below is added by one script tag. Build it with <code>pnpm build</code>, then serve this
      folder's parent (<code>python -m http.server 5174</code> in <code>apps/web</code>) and open
      <code>http://localhost:5174/demo/embed.html</code>. Add that origin to <code>CORS_ORIGINS</code>.</p>
    <script
      src="../dist/widget/campus-helpdesk-widget.js"
      data-api-url="http://localhost:8000"
      data-student-api-url="http://localhost:8001"
      data-title="Navrang Assist"
    ></script>
  </body>
</html>
