name: ci

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      slow:
        description: Run the slow tier (real models on the homelab runner)
        type: boolean
        default: false

jobs:
  # Fast tier (docs/spec.md 12.6): unit tests, scope-leak checks, retrieval metrics.
  # Runs on GitHub's runners with fake models, so it never needs the homelab.
  fast:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: helpdesk
          POSTGRES_PASSWORD: helpdesk
          POSTGRES_DB: helpdesk
        ports: ["5433:5432"]
        options: >-
          --health-cmd "pg_isready -U helpdesk" --health-interval 3s --health-timeout 3s --health-retries 20
    env:
      DATABASE_URL: postgresql://helpdesk:helpdesk@localhost:5433/helpdesk
      TEST_DATABASE_URL: postgresql://helpdesk:helpdesk@localhost:5433/helpdesk_test
      AI_BACKEND: fake
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: psql postgresql://helpdesk:helpdesk@localhost:5433/helpdesk -c "CREATE DATABASE helpdesk_test"
      - run: uv sync --locked
      - run: uv run ruff check . && uv run ruff format --check .
      - run: uv run pytest -q
      - run: uv run python -m evals.run --tier fast --backend fake

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 11 }
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: pnpm, cache-dependency-path: apps/web/pnpm-lock.yaml }
      - run: pnpm install --frozen-lockfile
      - run: pnpm build

  # Slow tier: full answers with qwen3.5:4b and bge-m3 on the homelab mini.
  # Runs on a self-hosted runner on the mini, only for changes to prompts, retrieval or models,
  # or on demand.
  #
  # SAFETY: a self-hosted runner executes workflow code on the mini itself. Before attaching it,
  # set the repository to require approval for workflows from outside contributors
  # (Settings > Actions > General), and never run this job for pull requests from forks.
  changes:
    runs-on: ubuntu-latest
    outputs:
      ai: ${{ steps.filter.outputs.ai }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            ai:
              - 'apps/api/prompts.py'
              - 'apps/api/retrieval/**'
              - 'apps/api/llm/**'
              - 'apps/api/chat.py'
              - 'apps/api/ingest/**'
              - 'data/**'
              - 'evals/**'

  slow:
    needs: [fast, changes]
    if: >-
      (github.event_name == 'workflow_dispatch' && inputs.slow) ||
      (github.event_name == 'push' && needs.changes.outputs.ai == 'true')
    runs-on: [self-hosted, homelab]
    env:
      AI_BACKEND: ollama
      OLLAMA_BASE_URL: http://localhost:11434/v1
    steps:
      - uses: actions/checkout@v4
      - run: docker run -d --rm --name helpdesk-ci-pg -e POSTGRES_USER=helpdesk -e POSTGRES_PASSWORD=helpdesk -e POSTGRES_DB=helpdesk -p 55432:5432 pgvector/pgvector:pg17
      - run: until docker exec helpdesk-ci-pg pg_isready -U helpdesk; do sleep 1; done
      - run: uv sync --locked
      - run: uv run python -m evals.run --tier slow
        env:
          DATABASE_URL: postgresql://helpdesk:helpdesk@localhost:55432/helpdesk
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: eval-run, path: evals/runs/ }
      - if: always()
        run: docker stop helpdesk-ci-pg
