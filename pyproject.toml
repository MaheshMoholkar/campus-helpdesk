[project]
name = "campus-helpdesk"
version = "0.1.0"
description = "AI assistant that answers campus queries for an invented university"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "psycopg[binary,pool]>=3.2",
    "pgvector>=0.3",
    "numpy>=2",
    "openai>=1.50",
    "pydantic-settings>=2.4",
    "httpx>=0.27",
    "pyyaml>=6",
    "opentelemetry-sdk>=1.45.0",
    "opentelemetry-exporter-otlp-proto-http>=1.45.0",
    "mcp>=1.2",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.6",
]

# The repo is run from its root (uvicorn apps.api.main:app), not installed as a package.
[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = ["db: needs a Postgres with pgvector (docker compose up -d postgres)"]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
# Line length is the formatter's job (ruff format); long translated strings are fine.
ignore = ["E501"]
